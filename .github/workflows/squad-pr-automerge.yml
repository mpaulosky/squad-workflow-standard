---
name: Squad PR Auto-Merge

"on":
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for squad/* PRs
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'squad/')
    steps:
      - name: Enable auto-merge (squash)
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            const pullNumber = context.payload.pull_request.number;

            await github.graphql(
              `mutation EnableAutoMerge($pullRequestId: ID!) {
                 enablePullRequestAutoMerge(input: {
                   pullRequestId: $pullRequestId,
                   mergeMethod: SQUASH
                 }) {
                   pullRequest {
                     number
                     autoMergeRequest {
                       mergeMethod
                       enabledAt
                     }
                   }
                 }
               }`,
              { pullRequestId }
            );

            core.info(`✅ Auto-merge enabled on PR #${pullNumber}`);

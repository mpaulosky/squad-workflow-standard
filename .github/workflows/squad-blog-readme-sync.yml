---
name: Blog → README Sync

"on":
  push:
    branches: [main]
    paths: ["docs/blog/index.md"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README Dev Blog section
        id: update_readme_sync
        run: |
          python3 - <<'PYEOF'
          import re

          with open('docs/blog/index.md', 'r') as f:
              index = f.read()

          # Extract table rows after the header and separator
          table_pattern = (
              r'\| Date \| Title \| Tags \|\s*\n'
              r'\|[-| ]+\|\s*\n'
              r'((?:\|.+\|\s*\n?)*)'
          )
          table_match = re.search(table_pattern, index)
          if not table_match:
              print("No table found in docs/blog/index.md — skipping")
              exit(0)

          rows = []
          for line in table_match.group(1).splitlines():
              line = line.strip()
              if (
                  line.startswith('|') and line.endswith('|')
                  and '---' not in line
              ):
                  # Rewrite relative links to docs/blog/ prefix
                  link_pattern = r'\]\((?!https?://)(?!docs/)([^)]+\.md)\)'
                  line = re.sub(link_pattern, r'](docs/blog/\1)', line)
                  rows.append(line)

          recent = rows[:5]
          if not recent:
              print("No posts found — skipping")
              exit(0)

          header = '| Date | Title | Tags |\n|------|-------|------|'
          new_section = header + '\n' + '\n'.join(recent)

          with open('README.md', 'r') as f:
              readme = f.read()

          updated = re.sub(
              r'<!-- BLOG_START -->.*?<!-- BLOG_END -->',
              f'<!-- BLOG_START -->\n{new_section}\n<!-- BLOG_END -->',
              readme,
              flags=re.DOTALL
          )

          if updated == readme:
              print("README Dev Blog section is already up to date")
              exit(0)

          with open('README.md', 'w') as f:
              f.write(updated)

          print("README Dev Blog section updated")
          PYEOF

          if git diff --quiet README.md; then
            echo "readme_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp README.md "$RUNNER_TEMP/README.blog-readme-sync.md"
          git restore README.md
          echo "readme_changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated README to sync branch
        id: commit_readme_sync
        if: steps.update_readme_sync.outputs.readme_changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev --depth=1
          git switch -C automation/blog-readme-sync origin/dev
          cp "$RUNNER_TEMP/README.blog-readme-sync.md" README.md

          if git diff --quiet README.md; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No README changes to commit against dev"
            exit 0
          fi

          git add README.md
          git commit -m \
            "docs: sync Dev Blog section from docs/blog/index.md [skip ci]"
          git push --force-with-lease origin HEAD
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse README sync PR to dev
        if: steps.commit_readme_sync.outputs.committed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:automation/blog-readme-sync`;

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'dev',
              head,
              per_page: 1
            });

            if (openPrs.data.length > 0) {
              core.info(
                `Existing README sync PR found: #${openPrs.data[0].number}`
              );
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: 'dev',
              head: 'automation/blog-readme-sync',
              title: 'docs: sync Dev Blog section from docs/blog/index.md',
              body: [
                'Automated README sync PR for the Dev Blog section.',
                '',
                '- Trigger: push to `main` affecting `docs/blog/index.md`',
                '- Behavior: commits README updates to',
                '  `automation/blog-readme-sync`',
                '- Target: opens or reuses a PR into `dev`'
              ].join('\n')
            });

            core.info(`Created README sync PR #${created.data.number}`);

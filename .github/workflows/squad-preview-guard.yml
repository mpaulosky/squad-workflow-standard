---
name: guard-preview-source

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  PREVIEW_BRANCH: preview
  PREVIEW_PROMOTION_BRANCH: >-
    ${{ vars.SQUAD_PREVIEW_PROMOTION_BRANCH ||
    'automation/promote-preview' }}

jobs:
  guard-preview-source:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info("Not a pull_request event.");
              return;
            }

            const previewBranch = process.env.PREVIEW_BRANCH;
            const promotionBranch = process.env.PREVIEW_PROMOTION_BRANCH;
            const target = context.payload.pull_request.base.ref;
            if (target !== previewBranch) {
              core.info(
                `Skipping source-branch guard for PR to ${target}; `
                + `guard only applies to ${previewBranch}.`
              );
              return;
            }

            const source = context.payload.pull_request.head.ref;
            const isValid = source === promotionBranch || source.startsWith("hotfix/");
            if (!isValid) {
              core.setFailed(
                `PRs to ${previewBranch} must come from ${promotionBranch} or hotfix/* branches. `
                + `Current source: ${source}`
              );
            }

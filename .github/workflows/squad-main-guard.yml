---
# yamllint disable rule:line-length
name: guard-main-source

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  PREVIEW_BRANCH: ${{ vars.SQUAD_PREVIEW_BRANCH || 'preview' }}
  MAIN_BRANCH: ${{ vars.SQUAD_MAIN_BRANCH || github.event.repository.default_branch || 'main' }}

jobs:
  guard-main-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info("Not a pull_request event.");
              return;
            }

            const mainBranch = process.env.MAIN_BRANCH;
            const previewBranch = process.env.PREVIEW_BRANCH;
            const target = context.payload.pull_request.base.ref;
            if (target !== mainBranch) {
              core.info(
                `Skipping source-branch guard for PR to ${target}; `
                + `guard only applies to ${mainBranch}.`
              );
              return;
            }

            const source = context.payload.pull_request.head.ref;
            const isValid = source === previewBranch || source.startsWith("hotfix/");
            if (!isValid) {
              core.setFailed(
                `PRs to ${mainBranch} must come from ${previewBranch} or hotfix/* branches. `
                + `Current source: ${source}`
              );
            }

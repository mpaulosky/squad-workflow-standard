---

name: guard-main-source

"on":

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  guard-main-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.info("Not a pull_request event.");
              return;
            }

            const mainBranch = "main";
            const devBranch = "dev";
            const target = context.payload.pull_request.base.ref;
            if (target !== mainBranch) {
              core.info(`Skipping source-branch guard for PR to ${target}; guard only applies to ${mainBranch}.`);
              return;
            }

            const source = context.payload.pull_request.head.ref;
            const isValid = source === devBranch || source.startsWith("hotfix/");
            if (!isValid) {
              core.setFailed(
                `PRs to ${mainBranch} must come from ${devBranch} or hotfix/* branches. Current source: ${source}`
              );
            }

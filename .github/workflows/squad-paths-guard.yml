# yamllint disable rule:line-length
---
name: Squad Paths Guard

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-main-paths:
    name: guard-main-paths
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for forbidden paths
        uses: actions/github-script@v9
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;
            const mainBranch = 'main';

            core.info(`Running path guard for PR ${headBranch} -> ${baseBranch}.`);

            // Fetch all files changed in this PR (paginated)
            const files = [];
            let page = 1;
            while (true) {
              const resp = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
                page
              });
              files.push(...resp.data);
              if (resp.data.length < 100) break;
              page++;
            }

            const forbidden = files
              .filter(f => {
                const filename = f.filename;
                // main: block new or modified .squad/ and team-docs/ paths, but allow removals.
                return f.status !== 'removed' && (
                  filename === '.squad' ||
                  filename.startsWith('.squad/') ||
                  filename.startsWith('team-docs/')
                );
              })
              .map(f => f.filename);

            if (forbidden.length === 0) {
              core.info(`✅ No forbidden paths found in PR to ${baseBranch} - all clear.`);
              return;
            }

            const remediationLines = [
              '```bash',
              '# Remove tracked .squad/ files (keeps local copies):',
              'git rm --cached -r .squad/',
              '',
              '# Remove tracked team-docs/ files:',
              'git rm --cached -r team-docs/',
              '',
              '# Commit the removal and push:',
              'git commit -m "chore: remove forbidden paths from PR"',
              'git push',
              '```',
              '',
              '> ⚠️ `.squad/` is committed on `dev` and `hotfix/*` branches by design.',
              `> The guard workflow keeps these files off \`${mainBranch}\`.`,
              '> `git rm --cached` untracks them from this PR without deleting your local copies.',
            ];

            const lines = [
              `## 🚫 Forbidden files detected in PR to ${baseBranch}`,
              '',
              `The following files must NOT be merged into \`${mainBranch}\`.`,
              '`.squad/` is runtime team state and belongs on `dev` and `hotfix/*` branches only.',
              '`team-docs/` is internal team content and belongs on `dev` and `hotfix/*` branches only.',
              '',
              '### Forbidden files found:',
              '',
              ...forbidden.map(f => `- \`${f}\``),
              '',
              '### How to fix:',
              '',
              ...remediationLines,
            ];

            core.setFailed(lines.join('\n'));

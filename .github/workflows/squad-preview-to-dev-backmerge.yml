---
name: Squad Back-merge preview to dev

"on":
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PREVIEW_BRANCH: preview
  DEV_BRANCH: dev
  BACKMERGE_BRANCH: automation/backmerge-preview-to-dev

concurrency:
  group: squad-preview-to-dev-backmerge
  cancel-in-progress: true

jobs:
  backmerge-sync-pr:
    name: Ensure preview → dev back-merge PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SQUAD_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build sanitized back-merge branch (preserve .squad from dev)
        id: prepare_backmerge
        run: |
          git fetch --all

          AHEAD_BY="$((
            git rev-list --count \
              "origin/${DEV_BRANCH}..origin/${PREVIEW_BRANCH}" || echo 0
          ))"
          if [[ "${AHEAD_BY}" == "0" ]]; then
            echo "should_open=false" >> "$GITHUB_OUTPUT"
            echo "No-op: ${DEV_BRANCH} already includes ${PREVIEW_BRANCH}."
            exit 0
          fi

          git switch -C "${BACKMERGE_BRANCH}" "origin/${DEV_BRANCH}"
          git merge "origin/${PREVIEW_BRANCH}" \
            --no-commit --no-ff -X theirs || true

          # Keep dev-owned squad state during preview -> dev back-merge.
          git checkout --ours -- .squad/ || true
          git add -A

          UNMERGED="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "${UNMERGED}" ]]; then
            echo "::error::Back-merge branch still has merge conflicts."
            printf '%s\n' "${UNMERGED}"
            exit 1
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync preview back into dev (.squad preserved)"
          else
            echo "No back-merge commit needed."
          fi

          git push --force-with-lease origin "${BACKMERGE_BRANCH}"
          echo "should_open=true" >> "$GITHUB_OUTPUT"

      - name: Create or reuse preview → dev PR
        if: ${{ steps.prepare_backmerge.outputs.should_open == 'true' }}
        uses: actions/github-script@v9
        env:
          BACKMERGE_BRANCH: ${{ env.BACKMERGE_BRANCH }}
        with:
          github-token: ${{ secrets.SQUAD_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const devBranch = process.env.DEV_BRANCH;
            const previewBranch = process.env.PREVIEW_BRANCH;
            const backmergeBranch = process.env.BACKMERGE_BRANCH;
            const head = `${owner}:${backmergeBranch}`;

            let compare;
            try {
              compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${devBranch}...${backmergeBranch}`
              });
            } catch (error) {
              if (error.status === 404) {
                core.info('No-op: dev and/or back-merge branch not found.');
                return;
              }
              throw error;
            }

            if (compare.data.ahead_by === 0) {
              core.info(
                `No-op: ${devBranch} already includes ` +
                `${backmergeBranch}.`
              );
              return;
            }

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: devBranch,
              head,
              per_page: 1
            });

            if (openPrs.data.length > 0) {
              core.info(
                `Existing back-merge PR found: #${openPrs.data[0].number}`
              );
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: devBranch,
              head: backmergeBranch,
              title: 'chore: sync preview back into dev',
              body: [
                'Automated back-merge PR to keep `dev` aligned with `preview`.',
                '',
                '- Trigger: push to `preview` (or manual dispatch)',
                '- Behavior: merges `preview` into a dev-derived branch',
                '  while preserving `.squad/` from `dev`',
                '- Source branch: `automation/backmerge-preview-to-dev`',
                '- Deduplication: reuses any existing open back-merge PR'
              ].join('\n')
            });

            core.info(`Created back-merge PR #${created.data.number}`);

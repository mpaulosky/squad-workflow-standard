---
name: Squad Promote

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — show what would happen without pushing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: write

env:
  DEV_BRANCH: ${{ vars.SQUAD_DEV_BRANCH || 'dev' }}
  PREVIEW_BRANCH: ${{ vars.SQUAD_PREVIEW_BRANCH || 'preview' }}
  PREVIEW_PROMOTION_BRANCH: ${{ vars.SQUAD_PREVIEW_PROMOTION_BRANCH || 'automation/promote-preview' }}
  MAIN_BRANCH: ${{ vars.SQUAD_MAIN_BRANCH || github.event.repository.default_branch || 'main' }}

jobs:
  dev-to-preview:
    name: Prepare dev → preview promotion PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state (dry run info)
        run: |
          echo "=== ${DEV_BRANCH} HEAD ===" && git log "origin/${DEV_BRANCH}" -1 --oneline
          echo "=== ${PREVIEW_BRANCH} HEAD ===" && git log "origin/${PREVIEW_BRANCH}" -1 --oneline
          echo "=== ${PREVIEW_PROMOTION_BRANCH} HEAD ==="
          git log "origin/${PREVIEW_PROMOTION_BRANCH}" -1 --oneline || echo "(branch does not exist yet)"
          echo "=== Files that would be stripped ==="
          git diff "origin/${PREVIEW_BRANCH}..origin/${DEV_BRANCH}" --name-only | grep -E "^(\.(ai-team|squad|ai-team-templates|squad-templates)|team-docs/|docs/proposals/)" || echo "(none)"

      - name: Prepare sanitized preview promotion branch
        if: ${{ inputs.dry_run == 'false' }}
        id: prepare_preview_promotion
        run: |
          git switch -C "${PREVIEW_PROMOTION_BRANCH}" "origin/${PREVIEW_BRANCH}"
          git merge "origin/${DEV_BRANCH}" --no-commit --no-ff -X theirs || true

          # Strip forbidden paths before opening the protected preview PR.
          git rm -rf --cached --ignore-unmatch \
            .ai-team/ \
            .squad/ \
            .ai-team-templates/ \
            .squad-templates/ \
            team-docs/ \
            "docs/proposals/" || true
          rm -rf \
            .ai-team/ \
            .squad/ \
            .ai-team-templates/ \
            .squad-templates/ \
            team-docs/ \
            docs/proposals/ || true

          UNMERGED="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "${UNMERGED}" ]]; then
            echo "::error::Sanitized ${DEV_BRANCH} -> ${PREVIEW_BRANCH} promotion branch still has merge conflicts."
            printf '%s\n' "${UNMERGED}"
            exit 1
          fi

          VERSION="$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo manual)"
          if [[ "${VERSION}" == "manual" ]]; then
            COMMIT_MESSAGE="chore: promote ${DEV_BRANCH} → ${PREVIEW_BRANCH} (sanitized)"
          else
            COMMIT_MESSAGE="chore: promote ${DEV_BRANCH} → ${PREVIEW_BRANCH} (v${VERSION}, sanitized)"
          fi

          if ! git diff --cached --quiet; then
            git commit -m "${COMMIT_MESSAGE}"
          else
            echo "ℹ️ No sanitized commit needed; promotion branch matches ${PREVIEW_BRANCH}"
          fi

          git push --force-with-lease origin "${PREVIEW_PROMOTION_BRANCH}"
          echo "promotion_branch=${PREVIEW_PROMOTION_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse sanitized dev → preview promotion PR
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/github-script@v9
        env:
          PROMOTION_BRANCH: ${{ steps.prepare_preview_promotion.outputs.promotion_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const devBranch = process.env.DEV_BRANCH;
            const previewBranch = process.env.PREVIEW_BRANCH;
            const promotionBranch = process.env.PROMOTION_BRANCH;
            const head = `${owner}:${promotionBranch}`;

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: previewBranch,
              head,
              per_page: 1
            });

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${previewBranch}...${promotionBranch}`
            });

            if (compare.data.ahead_by === 0) {
              if (openPrs.data.length > 0) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: openPrs.data[0].number,
                  state: 'closed'
                });
                core.info(`Closed stale promotion PR #${openPrs.data[0].number} because ${promotionBranch} is in sync with ${previewBranch}.`);
              } else {
                core.info(`No-op: ${previewBranch} is already up to date with ${promotionBranch}.`);
              }
              return;
            }

            if (openPrs.data.length > 0) {
              core.info(`Existing preview promotion PR found: #${openPrs.data[0].number}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: previewBranch,
              head: promotionBranch,
              title: `chore: promote ${devBranch} → ${previewBranch} via sanitized PR`,
              body: [
                'Automated promotion PR for protected preview.',
                '',
                `- Source branch: \`${devBranch}\``,
                `- Promotion branch: \`${promotionBranch}\``,
                `- Target branch: \`${previewBranch}\``,
                '- Behavior: merges dev into a preview-derived branch, strips forbidden paths, and opens or reuses a PR',
                '- Policy: avoids direct pushes to protected `preview`'
              ].join('\n')
            });

            core.info(`Created preview promotion PR #${created.data.number}`);

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no promotion branch or PR created."

  preview-to-main:
    name: Promote preview → main (release PR)
    needs: dev-to-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Show current state
        run: |
          echo "=== ${PREVIEW_BRANCH} HEAD ===" && git log "origin/${PREVIEW_BRANCH}" -1 --oneline
          echo "=== ${MAIN_BRANCH} HEAD ===" && git log "origin/${MAIN_BRANCH}" -1 --oneline
          VERSION="$(node -e "console.log('v' + require('./package.json').version)" 2>/dev/null || echo 'v(no package.json)')"
          echo "=== Version === ${VERSION}"

      - name: Validate preview is release-ready
        id: validate_release_ready
        run: |
          git checkout "${PREVIEW_BRANCH}"
          VERSION=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo "manual")
          if [[ "${VERSION}" != "manual" ]] && ! grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::Version $VERSION not found in CHANGELOG.md — update before releasing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Version ${VERSION} validated"

          # Verify no forbidden files on preview
          FORBIDDEN=$(git ls-files | grep -E "^(\.(ai-team|squad|ai-team-templates|squad-templates)/|team-docs/|docs/proposals/)" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files found on ${PREVIEW_BRANCH}: $FORBIDDEN"
            exit 1
          fi
          echo "✅ No forbidden files on ${PREVIEW_BRANCH}"

      - name: Create or reuse preview → main release PR
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ steps.validate_release_ready.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mainBranch = process.env.MAIN_BRANCH;
            const previewBranch = process.env.PREVIEW_BRANCH;
            const version = process.env.RELEASE_VERSION;
            const head = `${owner}:${previewBranch}`;

            let compare;
            try {
              compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${mainBranch}...${previewBranch}`
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(
                  `No-op: ${mainBranch} and/or ${previewBranch} branch not found.`
                );
                return;
              }
              throw error;
            }

            if (compare.data.ahead_by === 0) {
              core.info(
                `No-op: ${mainBranch} is already up to date with ${previewBranch}.`
              );
              return;
            }

            const openPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: mainBranch,
              head,
              per_page: 1
            });

            if (openPrs.data.length > 0) {
              core.info(
                `Existing release PR found: #${openPrs.data[0].number}`
              );
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              base: mainBranch,
              head: previewBranch,
              title: `chore: promote ${previewBranch} → ${mainBranch} (v${version})`,
              body: [
                'Automated release promotion PR for protected main.',
                '',
                '- Trigger: manual `squad-promote` run after syncing `' + previewBranch + '`',
                '- Behavior: opens or reuses a PR from `' + previewBranch + '` into `' + mainBranch + '`',
                '- Policy: avoids direct pushes to protected `main`',
                '- Version: `v' + version + '`'
              ].join('\n')
            });

            core.info(`Created release PR #${created.data.number}`);

      - name: Dry run complete
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "🔍 Dry run complete — no release PR created."

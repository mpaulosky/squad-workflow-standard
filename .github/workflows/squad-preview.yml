---
# yamllint disable rule:line-length
name: Squad Preview Validation
# Preview gate for pre-main validation in this .NET workflow-standard repo

"on":
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore squad-workflow-standard.slnx --nologo

      - name: Build solution
        run: dotnet build squad-workflow-standard.slnx --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test tests/Unit.Tests/Unit.csproj --configuration Release --no-build --nologo --verbosity normal

      - name: Validate preview workflow syntax
        run: |
          python3 <<'PY'
          from pathlib import Path

          import yaml

          workflow_path = Path('.github/workflows/squad-preview.yml')
          with workflow_path.open(encoding='utf-8') as handle:
              workflow = yaml.safe_load(handle)

          assert workflow.get('name') == 'Squad Preview Validation'
          assert 'jobs' in workflow and 'validate' in workflow['jobs']
          print(f'Preview workflow syntax check passed for {workflow_path}')
          PY

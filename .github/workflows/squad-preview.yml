---
# yamllint disable rule:line-length
name: Squad Preview Validation
# Preview gate for pre-main validation in this .NET workflow-standard repo

"on":
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore squad-workflow-standard.slnx --nologo

      - name: Build solution
        run: dotnet build squad-workflow-standard.slnx --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test tests/SquadWorkflowStandard.Tests/SquadWorkflowStandard.Tests.csproj --configuration Release --no-build --nologo --verbosity normal

      - name: Verify preview-branch workflow parity (normalized YAML)
        run: |
          # Keep canonical and source template workflows semantically identical while tolerating YAML style differences.
          if python3 <<'PY'
          import json
          from pathlib import Path

          import yaml


          def normalize_yaml(value):
              if isinstance(value, dict):
                  return {
                      str(key): normalize_yaml(value[key])
                      for key in sorted(value.keys(), key=lambda k: str(k))
                  }
              if isinstance(value, list):
                  return [normalize_yaml(item) for item in value]
              return value


          canonical = normalize_yaml(
              yaml.load(
                Path('.github/workflows/squad-preview.yml').read_text(),
                Loader=yaml.BaseLoader,
              )
          )
          source = normalize_yaml(
              yaml.load(
                Path('source/workflows/squad-preview.yml').read_text(),
                Loader=yaml.BaseLoader,
              )
          )

          if canonical == source:
              print('Preview-branch workflow parity check passed: normalized YAML content matches.')
              raise SystemExit(0)

          print('Preview-branch workflow parity check failed: normalized YAML content differs.')
          Path('/tmp/preview-workflow-canonical.json').write_text(json.dumps(canonical, indent=2, sort_keys=True))
          Path('/tmp/preview-workflow-source.json').write_text(json.dumps(source, indent=2, sort_keys=True))
          raise SystemExit(1)
          PY
          then
            exit 0
          else
            diff -u /tmp/preview-workflow-canonical.json /tmp/preview-workflow-source.json || true
            exit 1
          fi

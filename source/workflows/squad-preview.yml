name: Squad Preview Validation
# Preview gate for pre-main validation in this .NET workflow-standard repo

on:
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore squad-workflow-standard.slnx --nologo

      - name: Build solution
        run: dotnet build squad-workflow-standard.slnx --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet test tests/SquadWorkflowStandard.Tests/SquadWorkflowStandard.Tests.csproj --configuration Release --no-build --nologo --verbosity normal

      - name: Verify workflow mirror stays in sync
        run: |
          # Keep canonical and source template versions identical to prevent drift.
          diff -u .github/workflows/squad-preview.yml source/workflows/squad-preview.yml
